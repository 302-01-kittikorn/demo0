<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว | น้องโชกุน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* ส่วนหัวสีแดงตามสีที่ชอบ */
        .card-header {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            padding: 40px 20px;
            text-align: center;
            color: #ffffff;
            position: relative;
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .avatar-container i {
            font-size: 55px;
            color: #ff4b2b;
        }

        .card-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .card-header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* ส่วนข้อมูล */
        .card-body {
            padding: 30px 25px;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .icon-box {
            width: 45px;
            height: 45px;
            background: #fff5f5;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            transition: background 0.3s ease;
        }

        /* สี Icon Box แยกตามหัวข้อ */
        .icon-box.birthday { background: #e3f2fd; color: #2196f3; }
        .icon-box.food { background: #e8f5e9; color: #4caf50; }
        .icon-box.color { background: #ffebee; color: #f44336; }
        .icon-box.subject { background: #f3e5f5; color: #9c27b0; }
        .icon-box.friend { background: #fff3e0; color: #ff9800; } /* สีส้มพาสเทลสำหรับเพื่อนสนิท */

        .icon-box i {
            font-size: 1.2rem;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 0.85rem;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 2px;
            display: block;
        }

        .info-value {
            font-size: 1.05rem;
            color: #333333;
            font-weight: 500;
        }

        /* ตกแต่งแท็ก */
        .color-badge {
            display: inline-block;
            background: #ff4b2b;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .subject-tags {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .subject-badge {
            background: #f1f3f4;
            color: #5f6368;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="card-header">
            <div class="avatar-container">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <h1>ด.ช.กิตติกร สุธนะ</h1>
            <p>ชื่อเล่น: <strong>โชกุน</strong></p>
        </div>

        <div class="card-body">
            <div class="info-item">
                <div class="icon-box birthday">
                    <i class="fa-solid fa-cake-candles"></i>
                </div>
                <div class="info-content">
                    <span class="info-label">วันเกิด</span>
                    <span class="info-value">5 กันยายน พ.ศ. 2554</span>
                </div>
            </div>

            <div class="info-item">
                <div class="icon-box subject">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div class="info-content">
                    <span class="info-label">วิชาที่ชอบ</span>
                    <div class="subject-tags">
                        <span class="subject-badge">
                            <i class="fa-solid fa-calculator" style="color: #e91e63;"></i> คณิตศาสตร์
                        </span>
                        <span class="subject-badge">
                            <i class="fa-solid fa-laptop-code" style="color: #00bcd4;"></i> คอมพิวเตอร์
                        </span>
                    </div>
                </div>
            </div>

            <div class="info-item">
                <div class="icon-box food">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div class="info-content">
                    <span class="info-label">อาหารที่ชอบ</span>
                    <span class="info-value">ปลาย่าง <i class="fa-solid fa-fish" style="color: #3498db; margin-left: 5px;"></i></span>
                </div>
            </div>

            <div class="info-item">
                <div class="icon-box color">
                    <i class="fa-solid fa-palette"></i>
                </div>
                <div class="info-content">
                    <span class="info-label">สีที่ชอบ</span>
                    <span class="info-value">
                        <span class="color-badge">สีแดง</span>
                    </span>
                </div>
            </div>

            <div class="info-item">
                <div class="icon-box friend">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <div class="info-content">
                    <span class="info-label">เพื่อนสนิท</span>
                    <span class="info-value">ปังปอนด์ <i class="fa-solid fa-heart" style="color: #ff6b6b; margin-left: 5px; font-size: 0.9rem;"></i></span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
